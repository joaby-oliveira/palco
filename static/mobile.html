<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#110A1C">
<title>Palco · Pedir música</title>
<link rel="icon" href="/static/disco.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Outfit:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="/static/style.css?v=3">
<link rel="stylesheet" href="/static/mobile.css?v=3">
</head>
<body>
<!-- Primeira vez: como a galera te chama -->
<div class="onboard" id="onboard" hidden>
  <img src="/static/disco.svg" width="110" height="121" alt="">
  <div class="display" style="font-size:34px;color:var(--gold);line-height:1">PALCO</div>
  <form id="name-form" class="onboard-form">
    <label for="name-input" class="display" style="font-size:20px">COMO A GALERA TE CHAMA?</label>
    <input type="text" id="name-input" maxlength="24" autocomplete="nickname" placeholder="Seu nome ou apelido" required>
    <button class="btn big" type="submit">ENTRAR NA FESTA</button>
    <p class="sub" style="margin:0;text-align:center">O nome aparece no telão quando for a sua vez.</p>
  </form>
</div>

<main class="m-wrap" id="app">
  <header class="m-top">
    <span class="display" style="font-size:22px;color:var(--gold)">PALCO</span>
    <button class="me-chip" id="me-chip" aria-label="Trocar meu nome"></button>
  </header>

  <!-- Quem está cantando agora + voto -->
  <section class="now card" id="now" hidden aria-live="polite"></section>

  <!-- Pedir -->
  <section class="tab" id="tab-pedir">
    <div class="my-turn" id="my-turn" hidden></div>
    <form id="search-form" class="m-search">
      <label for="search-input" class="display" style="font-size:16px;letter-spacing:1px">PEDE A SUA</label>
      <div class="row">
        <input type="text" id="search-input" placeholder="Música, artista ou link" autocomplete="off">
        <button class="icon-btn" type="submit" aria-label="Buscar" style="background:var(--gold);color:var(--gold-ink);border:0"><i data-icon="search"></i></button>
      </div>
      <div class="seg" role="group" aria-label="Tipo de versão" style="align-self:flex-start">
        <button type="button" data-kind="original" class="on" aria-pressed="true">Original</button>
        <button type="button" data-kind="karaoke" aria-pressed="false">Já é karaokê</button>
      </div>
    </form>
    <div class="results" id="results"></div>
    <div class="section-head" style="margin:22px 0 10px">
      <h2 class="h-section" style="font-size:16px">JÁ PRONTAS PRA CANTAR</h2>
      <input type="search" class="lib-filter" id="lib-filter" placeholder="Procurar" aria-label="Procurar no repertório" style="min-width:0;width:140px">
    </div>
    <ul class="queue-list" id="library"></ul>
  </section>

  <!-- Fila -->
  <section class="tab" id="tab-fila" hidden>
    <h2 class="h-section" style="font-size:18px;margin-bottom:12px">FILA DA FESTA</h2>
    <ol class="queue-list" id="queue"></ol>
  </section>

  <!-- Efeitos -->
  <section class="tab" id="tab-efeitos" hidden>
    <div style="margin-bottom:14px">
      <div class="display" style="font-size:24px;line-height:1;color:var(--gold)">MESA DO ANIMADOR</div>
      <div class="sub">Toca no telão na hora. Sem exagero, hein!</div>
    </div>
    <div class="pads" id="pads"></div>
    <div class="sound-board" id="sounds"></div>
  </section>
</main>

<nav class="tabs" aria-label="Seções">
  <button data-tab="pedir" class="on" aria-current="page"><i data-icon="mic" data-size="22"></i>Pedir</button>
  <button data-tab="fila"><i data-icon="list" data-size="22"></i><span>Fila <b id="queue-count"></b></span></button>
  <button data-tab="efeitos"><i data-icon="pads" data-size="22"></i>Efeitos</button>
</nav>

<script src="/static/common.js?v=3"></script>
<script src="/static/mobile.js?v=3"></script>
</body>
</html>
