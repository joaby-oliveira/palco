[project]
name = "karaoke"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "yt-dlp[default]",  # [default] traz o yt-dlp-ejs, que resolve o desafio de JavaScript do YouTube (com o deno)
    "httpx>=0.27",
    "qrcode>=7.4",
    "numpy>=1.26",
    "mediapipe>=0.10.14",  # modo dança: marca a pose do coach no vídeo
    "cryptography>=42",    # certificado HTTPS para a câmera do celular
]

[project.optional-dependencies]
local = ["audio-separator[cpu]>=0.30", "audioread"]
